/* v0.6: show outcomes as experiences, not rows in reports */
.show-result{text-align:center;border-color:var(--gold)}
.show-result.soldout{border-color:#76e5a0;box-shadow:0 0 70px #2bd28325,0 18px 48px #0008}
.show-result.fail{border-color:#e96969;box-shadow:0 0 70px #e9696930,0 18px 48px #0008}
.show-result .progress{height:14px}
.campaign-score{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:18px;color:#dedee5;font-size:13px}
.campaign-modal .timing-track{box-shadow:0 0 0 4px #ffffff08;overflow:hidden}
.campaign-modal .timing-zone{background:linear-gradient(90deg,#64c782b8,#adffd1b8);border-left:2px solid #d6ffe4;border-right:2px solid #d6ffe4}
.campaign-modal .timing-needle{width:7px;background:#fff7bb;box-shadow:0 0 11px #fff6c9}
.campaign-modal .modal-actions .primary{min-height:56px;font-size:16px}
@media(max-width:600px){.campaign-modal{padding:22px}.show-result .resultbig{font-size:35px}}

.channel-cheatsheet b,.channel-cheatsheet small{display:block}.channel-cheatsheet b{font-size:12px}.channel-cheatsheet small{font-size:10px;color:#b8bbc7;margin-top:3px}

.chart-panel{margin-top:16px;border:1px solid #3c3d4b;border-radius:16px;padding:14px;background:#21232e}

.tour-warning{padding:12px 15px;margin:0 0 12px;border:1px solid #7c6432;border-radius:13px;background:#322919;color:#ffe4a2;font-size:13px}
.tour-warning strong{color:#fff0b7}.tour-warning.urgent{border-color:#c65b53;background:#412024;color:#ffd9d6}
.tour-warning.urgent strong{color:#fff}.tour-warning.prep{border-color:#465c70;background:#222b37;color:#cbdff3}
.tourcity.done{opacity:1;background:#191e25;border:1px solid #536257;box-shadow:inset 4px 0 0 #78b68e}
.tourcity.done .citytap{opacity:.84}.tourcity.done .progress i{background:linear-gradient(90deg,#648d76,#88b79c)}
.citylabel .citybadge{display:inline-flex;align-items:center;white-space:nowrap;vertical-align:middle;line-height:1.3;margin-left:9px;font:800 10px/1.5 Inter,system-ui,sans-serif;padding:3px 7px;border-radius:6px;border:1px solid #5c6e60;color:#a9efc3;background:#254033}
.citylabel .citybadge.tomorrow{color:#ffddd5;border-color:#b4524d;background:#5b2f2c}
.citylabel .citybadge.soon{color:#ffe5a3;border-color:#988448;background:#433b25}
.citylabel .citybadge.soldout{color:#fff1ad;border-color:#b69e50;background:#4d421e}
.citylabel .citybadge.flopped{color:#ffc0b9;border-color:#c8645f;background:#4e282b}
.city-metrics{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 12px 9px 68px;font-size:12px;color:#cbd0df}
.city-metrics span{display:inline-flex;gap:6px;align-items:center}.city-metrics b{font-weight:900}
@media(max-width:520px){.city-metrics{margin-left:55px;gap:10px;font-size:11px}.citylabel .citybadge{margin-left:0;margin-top:5px;display:table;font-size:9px}}

function stopMini(){if(g.modal!=='campaign'||g.mini.status!=='running')return;

function reallocate(k,next){let keys=['search','meta','youtube','pr'].filter(x=>x!==k);next=clamp(Math.round(next/5)*5,0,100);let target=100-next;let total=keys.reduce((s,x)=>s+g.adMix[x],0);let allocated=0;keys.slice(0,-1).forEach(x=>{let n=total?Math.floor(target*g.adMix[x]/total/5)*5:Math.floor((target/3)/5)*5;g.adMix[x]=n;allocated+=n;});g.adMix[keys[2]]=target-allocated;g.adMix[k]=next;}

function ticketSales(c,s,{noCampaign=false,randomFactor=null}={}){
 const venueCap=venue(c)[1],weeksLeft=Math.max(1,s.week-g.week+1),base=24+venueCap*.032+c.big*20+c.reach*.45+(s.localRep??c.rep)*.33;
 // Охват увеличивает количество потенциальных покупателей; рейтинг — вероятность покупки.
 const influence=(.28+g.reach*.014)*(.30+g.rep*.013)*(.46+g.mood*.0068)*(.76+(s.localRep??c.rep)*.004);
 const priceEffect=clamp(1-(s.price-c.price)*.018,.58,1.33);
 const m=g.adMix;
 // Google чаще конвертирует сразу, Meta и YouTube разгоняют интерес, PR добавляет доверие.
 const channel=noCampaign?.72:(.72+m.search*.009+m.meta*.0035+m.youtube*.0014+m.pr*.0008);
 const adsFactor=noCampaign?.42:(g.adMode===0?.45:g.adMode===1?1.02:1.44);
 const miniGame=(noCampaign||g.adMode===0)?1:(g.mini.status==='done'?g.mini.quality:.83);
 const urgency=weeksLeft===1?1.22:1;
 const level=g.boostCities?.[c.id],cityBoost=BOOST_LEVELS[level]?.mult||1;
 const cityAwareness=(.78+s.exposure*.0108);
 const randomness=randomFactor??(.89+Math.random()*.22);
 const difficulty=c.hard||1;
 return Math.max(0,Math.round(base*influence*priceEffect*channel*adsFactor*miniGame*urgency*cityBoost*cityAwareness*randomness*difficulty*.36));
}

 if(!g.adConfirmed){notify('Сначала подтверди рекламные каналы и пройди мини-игру');return;}
 const wk=g.week,start=g.weeklyStart;
 let cost=totalWeekCost();
 if(cost>affordableAdSpend()){
   // Saved games and unexpected expenses must not softlock the season.
   g.adMode=0;g.boostCities={};g.mini={status:'done',quality:1,value:0,stage:2,hits:[],target:50};
   cost=0;notify('Бюджет исчерпан: игра продолжится без платной рекламы.');
 }
 g.cash-=cost;
 let sales=0,baseSales=0,closed=[];
 for(const c of picked()){
   const s=cstate(c.id);s.last=0;
   if(s.finished){s.reachChange=0;s.repChange=0;continue;}
   const left=venue(c)[1]-s.sold,randomFactor=.89+Math.random()*.22;
   const actual=Math.min(left,ticketSales(c,s,{randomFactor}));
   // Контрольный расчёт с тем же спросом, событием, ценой и местным бустом, но без туровой рекламы.
   const baseline=Math.min(left,ticketSales(c,s,{noCampaign:true,randomFactor}));
   const units=actual;
   s.last=units;s.sold+=units;s.history.push({week:wk,sales:units});
   const mix=g.adMix;
   const beforeReach=clamp(c.reach+s.exposure,0,100),beforeRep=s.localRep??c.rep;
   s.exposure=clamp(s.exposure+(g.adMode===2?3:g.adMode===1?1:0)+(g.adMode>0?Math.round((mix.meta*.085+mix.youtube*.10)*(g.adMode===2?1.35:1)):0)+(BOOST_LEVELS[g.boostCities?.[c.id]]?.exposure||0),0,60);
   const localPR=g.adMode===0?-1:Math.round(mix.pr*(g.adMode===2?.070:.038));
   const promoRep=g.boostCities?.[c.id]==='strong'?2:g.boostCities?.[c.id]==='medium'?1:0;
   s.localRep=clamp(beforeRep+localPR+promoRep,0,100);
   s.reachChange=clamp(c.reach+s.exposure,0,100)-beforeReach;
   s.repChange=s.localRep-beforeRep;
   sales+=units;baseSales+=baseline;
   // Билеты — цель игры, они не пополняют бюджет.
   if(s.week===wk){
     s.finished=true;
     const operationalCost=Math.round(venue(c)[2]*.65+2200+venue(c)[1]*.72+(c.id==='nice'?2600:0));
     g.cash-=operationalCost;
     const underfunded=g.cash<0,fill=s.sold/venue(c)[1],soldout=s.sold>=venue(c)[1];
     let emotion=soldout?'soldout':fill>=.80?'great':fill>=.53?'average':'fail';
     if(underfunded)emotion='fail';
     s.emotion=emotion;
     g.rep=clamp(g.rep+(soldout?12:fill>=.80?6:fill>=.53?-2:-11)-(underfunded?7:0),0,100);
     g.mood=clamp(g.mood+(soldout?9:fill>=.80?4:fill>=.53?-2:-9)-(underfunded?8:0),0,100);
     closed.push({name:c.name,sold:s.sold,capacity:venue(c)[1],fill:Math.round(fill*100),emotion,underfunded,operationalCost});
   }
 }
 const m=g.adMix,active=g.adMode>0;
 const weeklyReach=(active?(g.adMode===1?0:1)+Math.round((m.meta*.04+m.youtube*.08)*(g.adMode===2?1.25:1)):-10);g.reach=clamp(g.reach+reachDeltaSoft(weeklyReach),0,100);
 g.rep=clamp(g.rep+(active?Math.round(m.pr*.11*(g.adMode===2?1.4:1)):0)+(g.mini.quality>1.4?2:0),0,100);
 g.mood=clamp(g.mood+(g.adMode===2?-3:g.adMode===0?2:0),0,100);
 const change={cash:g.cash-start.cash,reach:g.reach-start.reach,rep:g.rep-start.rep,mood:g.mood-start.mood};
 const liftPct=baseSales>0?Math.round((sales-baseSales)/baseSales*100):0;
 let largestChannel=Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0];
 const channelNames={search:'Google Search',meta:'Meta Ads',youtube:'YouTube',pr:'PR'};
 const channelExplain={search:'Google дал быстрые покупки здесь и сейчас.',meta:'Meta помогла продажам и одновременно разогрела следующий ход.',youtube:'YouTube почти не продаёт мгновенно, зато заметно увеличивает будущий спрос.',pr:'PR поднимает доверие к шоу: после него зрители охотнее покупают билеты.'};
 let trendPct=g.weekSales.length&&g.weekSales.at(-1).sales>0?Math.round((sales/g.weekSales.at(-1).sales-1)*100):null;
 g.weekSales.push({week:wk,sales});
 g.reportFromEnd=true;
 g.report={week:wk,sales,cost,closed,change,byCity:picked().map(c=>({name:c.name,newSold:cstate(c.id).last,pct:cityPct(c)})),eventTitle:start.eventTitle,eventChoice:start.eventChoice,eventDetail:start.eventDetail,liftPct:active?liftPct:0,trendPct,topChannel:active?channelNames[largestChannel]:null,channelText:active?channelExplain[largestChannel]:'Рекламу не запускали: общий охват снизился.',baseline:baseSales};
 g.logs.unshift(`Неделя ${wk}: +${F(sales)} билетов; ${active?'реклама +'+liftPct+'% к сценарию без кампании':'без рекламы'}; расходы ${E(cost)}`);
 g.paused=true;g.week++;
 if(g.week>9){g.phase='final';g.tourDone=true;}
 g.cityResultQueue=closed.slice();
 g.modal=g.cityResultQueue.length?'city-result':'report';
 save();render();
}
function nextCityResult(){
 if(g.modal!=='city-result')return;
 g.cityResultQueue.shift();g.modal=g.cityResultQueue.length?'city-result':'report';render();
}
function autoEndWeek(){
 if(g.phase!=='play'||g.modal||!g.eventResolved)return;
 if(!g.adConfirmed){g.adMode=0;g.boostCities={};g.mini={status:'done',quality:.65,value:0,stage:2,hits:[],target:50};g.adConfirmed=true;notify('Время вышло: игра продолжается без рекламы и усилений.');}
 endWeek();
}
function delta(n){return (n>=0?'+':'')+F(n);}
function renderModal(){let root=$('modalRoot');if(!g.modal){root.innerHTML='';return;}
 if(g.modal==='event'){
  let e=g.event;root.innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="Событие недели"><div class="eyebrow">НЕДЕЛЯ ${g.week} · НЕОЖИДАННОСТЬ</div><div class="event-emoji">${e.emoji}</div><h2>${e.title}</h2><p>${e.text}</p><div class="choices">${e.choices.map((ch,i)=>`<button class="eventchoice" data-choice="${i}"><span><strong>${ch.title}</strong><small>${ch.sub}</small></span><span class="arr">→</span></button>`).join('')}</div></section></div>`;
  root.querySelectorAll('[data-choice]').forEach(x=>x.onclick=()=>resolveEvent(+x.dataset.choice));return;
 }
 if(g.modal==='city-result'){
  const c=g.cityResultQueue[0];if(!c){g.modal='report';renderModal();return;}
  const conf={soldout:['🤩','SOLD OUT!','Начальник прыгает от счастья. Команда поёт Queen в автобусе.','good'],great:['🥳','Зал почти полный!','Инвестор впервые за сезон сказал: «Молодцы». Это подозрительно.','good'],average:['😬','Могло быть и лучше','Инвестор недоволен, но пока обошлось без созвона.','gold'],fail:['😡','ИНВЕСТОР В ЯРОСТИ','«КТО УТВЕРДИЛ ЭТОТ ЗАЛ?! ГДЕ БИЛЕТЫ?!» В переговорной летают презентации.','bad']}[c.emotion];
  $('modalRoot').innerHTML=`<div class="overlay"><section class="modal show-result ${c.emotion}" role="dialog" aria-modal="true"><div class="eyebrow">🏟️ КОНЦЕРТ СОСТОЯЛСЯ</div><div class="event-emoji" style="font-size:75px">${conf[0]}</div><h2>${conf[1]}</h2><p style="font-size:18px;color:white">${c.name} · ${c.fill}% зала</p><div class="resultbig ${conf[3]}">${F(c.sold)} / ${F(c.capacity)} 🎟️</div><div class="progress" style="margin:15px 0"><i style="width:${c.fill}%"></i></div><p>${conf[2]}</p>${c.underfunded?'<div class="notice" style="color:#ffaaaa">⚠ Денег не хватило на организацию концерта. Репутация и команда получили дополнительный штраф.</div>':''}<div class="subtle">Расходы на организацию: ${E(c.operationalCost)} · Продажи билетов не пополняют бюджет</div><div class="modal-actions"><button class="primary" id="nextCityResult">${g.cityResultQueue.length>1?'Следующий концерт →':'Итоги недели →'}</button></div></section></div>`;
  $('nextCityResult').onclick=nextCityResult;return;
 }
 if(g.modal==='campaign'){
  const st=g.mini.status,stage=g.mini.stage;
  const title=stage===0?'Раунд 1 — поймай охват':stage===1?'Раунд 2 — преврати в продажи':'Рекламная кампания готова!';
  const note=stage===0?'Окно успеха движется. Останови маркер точно в светлой зоне.':stage===1?'Теперь скорость выше, а окно успеха в другом месте.':'Два раунда сыграны. Итоговая эффективность повлияет на продажи всей Франции.';
  $('modalRoot').innerHTML=`<div class="overlay"><section class="modal campaign-modal" role="dialog" aria-modal="true"><div class="eyebrow">🎮 РЕКЛАМНАЯ МИНИ-ИГРА · ${Math.min(stage+1,2)} / 2</div><div class="event-emoji">${st==='done'?'🎉':'🎯'}</div><h2>${title}</h2><p>${note}</p><div class="campaign-score"><span>Бюджет: <b>${E(marketingCost())}</b></span><span>Команда: <b>${g.mood}/100</b></span></div><div class="timing-track" style="margin:22px 0 15px;height:48px"><div class="timing-zone" id="timingZone"></div><div class="timing-needle" id="timingNeedle"></div></div>
   <div class="subtle">${st==='intermission'?'Первый раунд: '+(g.mini.hits[0]>=1.35?'🔥 Отлично!':'⚡ Готово')+' · осталось второе испытание':st==='done'?miniLabel():'Нажми «Стоп» или пробел, когда белый маркер совпадёт с зелёной зоной.'}</div>
   <div class="modal-actions">${st==='done'?'<button class="primary" id="applyCampaign">✓ Применить рекламу</button>':`<button class="primary" id="miniModalBtn">${st==='running'?'✋ СТОП!':stage===0?'▶ НАЧАТЬ РАЗГОН':'▶ ВТОРОЙ РАУНД'}</button>`}</div>
  </section></div>`;
  const miniBtn=$('miniModalBtn');if(miniBtn)miniBtn.onclick=()=>{if(g.mini.status==='running')stopMini();else startMini();};
  const apply=$('applyCampaign');if(apply)apply.onclick=applyCampaign;
  updateMiniVisual();return;
 }
 if(g.modal==='report'){
  let r=g.report,final=g.phase==='final';root.innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="Результат недели"><div class="eyebrow">${final?'🏆 СЕЗОН ЗАВЕРШЁН':'⚡ ХОД ЗАВЕРШЁН'}</div><h2>${final?'Французский тур окончен!':'Неделя '+r.week+' сыграна!'}</h2><div class="resultbig">+${F(r.sales)} билетов</div><div class="ad-performance ${r.liftPct>0?'win':''}"><strong>${r.topChannel?(r.liftPct>0?'🎉 Реклама сработала! +'+r.liftPct+'% билетов':'📣 Реклама дала небольшой эффект'): '🧊 Без рекламы на этой неделе'}</strong><small>${r.topChannel?'Сравнение с тем же ходом без общей кампании. '+r.channelText:r.channelText}</small>${r.trendPct!==null?`<span class="subtle">К прошлой неделе: ${r.trendPct>=0?'+':''}${r.trendPct}% продаж</span>`:''}</div><p class="subtle">${r.eventTitle} · ${r.eventChoice}</p><div class="reportmetrics"><div class="reportmetric"><small>💶 Бюджет (расходы и события)</small><strong class="${r.change.cash>=0?'good':'bad'}">${r.change.cash>=0?'+':''}${E(r.change.cash)}</strong></div><div class="reportmetric"><small>📣 Охват</small><strong>${delta(r.change.reach)}</strong></div><div class="reportmetric"><small>⭐ Рейтинг</small><strong>${delta(r.change.rep)}</strong></div><div class="reportmetric"><small>🎸 Команда</small><strong>${delta(r.change.mood)}</strong></div></div><div style="height:10px"></div>${r.byCity.map(c=>`<div class="reportcity"><strong>${c.name}</strong><div class="progress"><i style="width:${c.pct}%"></i></div><strong>+${F(c.newSold)} 🎟️</strong></div>`).join('')}<div class="mini-graph-head" style="margin-top:16px">📈 Продажи за весь тур</div>${salesChart(g.weekSales,true)}${r.closed.length?`<div class="notice" style="margin-top:14px">🎸 Сыграно концертов: ${r.closed.map(c=>c.name+' ('+c.fill+'%)').join(', ')}</div>`:''}<div class="modal-actions"><button class="primary" id="nextModal">${final?'🏁 Показать финал':'Продолжить →'}</button></div></section></div>`;
  $('nextModal').onclick=()=>{g.modal=null;if(final){g.modal='final';g.paused=true;}else if(g.reportFromEnd){g.reportFromEnd=false;startEvent();}else{g.paused=!!g.reportResumePaused;}render();};return;
 }
 if(g.modal==='final'){
  let done=completedCount(),avgFill=Math.round(picked().reduce((x,c)=>x+cityPct(c),0)/5),rank=g.cash<0?'БЮДЖЕТ ПРОВАЛЕН':avgFill>=90?'КОРОЛЬ ФРАНЦУЗСКИХ АНШЛАГОВ':avgFill>=70?'УСПЕШНЫЙ ПРОМОУТЕР':avgFill>=50?'ТУР ПРОШЁЛ СО СКРИПОМ':'ИНВЕСТОР УВОЛИЛ ВСЕХ';root.innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="Итоги тура"><div class="eyebrow">🏆 FRANCE TOUR · ФИНАЛ</div><div class="event-emoji">🎸🏟️</div><h2>${rank}</h2><p>Начальник снова просит отчёт. А ты просто покажи ему эти цифры.</p><div class="reportmetrics"><div class="reportmetric"><small>Концертов</small><strong>${done}/5</strong></div><div class="reportmetric"><small>Билетов продано</small><strong>${F(totalTickets())}</strong></div><div class="reportmetric"><small>Остаток бюджета</small><strong>${E(g.cash)}</strong></div><div class="reportmetric"><small>Средний аншлаг</small><strong>${avgFill}%</strong></div></div><div class="modal-actions"><button class="primary" id="copyFinal">Скопировать результат</button><button class="secondary" id="restartFinal">Новый тур ↻</button></div></section></div>`;
  $('copyFinal').onclick=share;$('restartFinal').onclick=restart;return;
 }
 if(g.modal==='help'){
  root.innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="Правила"><div class="eyebrow">КОРОТКО О ГЛАВНОМ</div><h2>Спаси французский тур!</h2><p>🗺️ <strong>План:</strong> отметь на карте 5 из 11 городов, выбери залы и нажми «Утвердить».</p><p>👔 <strong>Неделя 1:</strong> начальник обязательно приедет с разносом. Потом — случайное событие каждую неделю.</p><p>📣 <strong>Реклама:</strong> выбери общий бюджет на Францию, затем кнопками + / − раздай 100% по каналам и подтверди кампанию.</p><p>🎮 <strong>Мини-игра:</strong> после подтверждения рекламы пройди два раунда во всплывающем окне. Настроение команды влияет на сложность.</p><p>🎟️ <strong>Залы:</strong> нажимай на город, меняй цену и покупай локальные бусты. На 9-й неделе тур закончится. Первые четыре недели можно активно рекламироваться до первого концерта.</p><div class="choices"><button class="primary" id="closeHelp" style="width:100%">Понятно, играть!</button></div></section></div>`;
  $('closeHelp').onclick=()=>{g.modal=g.helpReturn||null;g.helpReturn=null;g.paused=!!g.helpWasPaused;render();};
 }
}
function share(){const msg=`🎸 LEGENDARY ROCK VOICES — FRANCE TOUR\n🎟️ Билетов: ${F(totalTickets())}\n🏟️ Концертов: ${completedCount()}/5\n💶 Остаток бюджета: ${E(g.cash)}\n📣 Охват: ${g.reach}/100\n⭐ Рейтинг: ${g.rep}/100\n🎸 Команда: ${g.mood}/100\nСможешь лучше?`;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(msg).then(()=>notify('Результат скопирован')).catch(()=>window.prompt('Результат:',msg));else window.prompt('Скопируй результат:',msg);}
function restart(){if(!confirm('Начать новую игру? Предыдущее сохранение будет удалено.'))return;g=newGame();render();}
function render(){if(g.phase==='plan')renderPlan();else if(g.phase==='play'||g.phase==='final')renderPlay();renderModal();updateTimerUI();save();}
function ticker(now){if(!lastFrame)lastFrame=now;let dt=Math.min((now-lastFrame)/1000,.15);lastFrame=now;
 if(g.phase==='play'&&g.eventResolved&&!g.paused&&!g.modal){g.timer=Math.max(0,g.timer-dt);secondsSave+=dt;if(g.timer<=0){g.timer=0;autoEndWeek();}else{if(secondsSave>4){save();secondsSave=0;}updateTimerUI();}}
 if(g.phase==='play'&&g.modal==='campaign'&&g.mini.status==='running'){
  let t=(now-g.mini.startedAt)/1000,stage=g.mini.stage;
  let period=(stage===0?1250:850)+g.mood*(stage===0?4:2);
  let phase=(t*1000/period)%2;
  let wave=phase<=1?phase*100:(2-phase)*100;
  g.mini.value=clamp(wave+Math.sin(t*(stage===0?5:9))*3,1,99);
  g.mini.target=clamp((stage===0?32:69)+Math.sin(t*(stage===0?2.4:4.1))*10,14,86);
  updateMiniVisual();
 }
 raf=requestAnimationFrame(ticker);
}
$('pauseBtn').onclick=()=>{if(g.phase!=='play'||!g.eventResolved||g.modal||g.mini.status==='running')return;g.paused=!g.paused;updateTimerUI();save();};
$('endBtn').onclick=endWeek;
document.addEventListener('keydown',ev=>{if(ev.code==='Space'&&g.modal==='campaign'&&['idle','running','intermission'].includes(g.mini.status)){ev.preventDefault();if(g.mini.status==='running')stopMini();else startMini();}});
$('helpBtn').onclick=()=>{if(g.modal==='help')return;g.helpReturn=g.modal||null;g.helpWasPaused=g.paused;g.modal='help';g.paused=true;renderModal();};
$('restartBtn').onclick=restart;
render();raf=requestAnimationFrame(ticker);
})();
</script>
